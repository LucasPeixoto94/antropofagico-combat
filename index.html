<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antropofágico Combat</title>
  <meta name="description" content="Antropofágico Combat: protótipo de jogo de luta 2D em pixel art com personagens do folclore brasileiro, jogável no navegador.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #0f2a1d 0%, #07130d 55%, #030806 100%);
      color: #e8f5e9;
      font-family: 'Press Start 2P', monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    #game {
      /* O renderer.js dimensiona o canvas para a janela inteira (em pixels do dispositivo)
         e desenha o jogo com escala inteira, centralizado; as barras mostram o fundo da página. */
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
    }
    #file-warning {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      line-height: 2;
      font-size: 12px;
      background: rgba(3, 8, 6, 0.96);
      z-index: 10;
    }
    #file-warning code {
      color: #ffd166;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden">Antropofágico Combat — jogo de luta do folclore brasileiro</h1>
    <canvas id="game" width="480" height="270" tabindex="0" aria-label="Tela do jogo Antropofágico Combat"></canvas>
  </main>

  <div id="file-warning" role="alert">
    <p>
      Este jogo usa módulos ES e não roda abrindo o arquivo direto.<br>
      Na pasta do projeto, rode <code>python -m http.server 8000</code><br>
      e abra <code>http://localhost:8000</code>
    </p>
  </div>

  <noscript>
    <p style="text-align:center">Antropofágico Combat precisa de JavaScript habilitado.</p>
  </noscript>

  <script>
    if (location.protocol === 'file:') {
      document.getElementById('file-warning').style.display = 'flex';
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
